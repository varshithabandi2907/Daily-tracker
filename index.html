<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIFE TRACKER — Your Personal Life Book</title>
<style>
:root{
  --bg:#f4f0e7; --paper:#fffdf8; --paper2:#f8f4eb; --ink:#292824;
  --muted:#7b776f; --line:#ded7ca; --sage:#718574; --sage2:#dce5da;
  --gold:#b28b4a; --rose:#b98682; --blue:#7891a6; --danger:#a85f5f;
  --shadow:0 18px 50px rgba(52,45,35,.10); --radius:20px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
body{background:
 radial-gradient(circle at 10% 0%,rgba(178,139,74,.07),transparent 28rem),
 radial-gradient(circle at 90% 10%,rgba(113,133,116,.09),transparent 32rem);
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:500}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;padding:26px 18px;border-right:1px solid var(--line);background:rgba(255,253,248,.82);backdrop-filter:blur(14px);z-index:20}
.brand{padding:5px 10px 28px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand small{letter-spacing:.18em;color:var(--gold);font-size:10px}
.brand h1{margin:5px 0 0;font-size:25px;letter-spacing:.04em}
.nav{display:grid;gap:6px}
.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:12px 13px;border-radius:12px;display:flex;gap:11px;align-items:center}
.nav button:hover,.nav button.active{background:var(--sage2);color:var(--ink)}
.nav .icon{width:20px;text-align:center}
.sidebar-foot{position:absolute;bottom:20px;left:18px;right:18px}
.progress-mini{background:var(--paper2);border:1px solid var(--line);padding:12px;border-radius:14px}
.progress-mini .bar{height:5px;background:#e4ded2;border-radius:10px;margin-top:8px;overflow:hidden}
.progress-mini .bar i{display:block;height:100%;background:var(--sage);border-radius:10px}
.main{min-width:0;padding:22px 28px 50px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;max-width:1280px;margin:0 auto 18px}
.crumb{color:var(--muted);font-size:13px}
.top-actions{display:flex;gap:8px}
.icon-btn,.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:9px 12px}
.btn.primary{background:var(--ink);color:white;border-color:var(--ink)}
.btn.soft{background:var(--sage2);border-color:transparent}
.btn.danger{color:white;background:var(--danger);border-color:var(--danger)}
.btn:hover,.icon-btn:hover{transform:translateY(-1px)}
.view{max-width:1280px;margin:auto}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:20px 0}
.kicker{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
.hero h2{font-size:42px;margin:7px 0 4px}
.hero p{margin:0;color:var(--muted)}
.date-line{font-size:14px;color:var(--muted)}
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.card{background:rgba(255,253,248,.9);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 8px 30px rgba(52,45,35,.045)}
.card h3{margin:0 0 12px;font-size:20px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}
.metric{min-height:115px}
.metric .label{font-size:12px;color:var(--muted)}
.metric .value{font-family:Georgia,serif;font-size:31px;margin:7px 0}
.metric .sub{font-size:12px;color:var(--muted)}
.progress{height:8px;background:#e7e0d4;border-radius:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--sage);border-radius:10px}
.split{display:flex;justify-content:space-between;align-items:center;gap:14px}
.list{display:grid;gap:8px}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee8de}
.list-row:last-child{border-bottom:0}
.check{display:flex;align-items:center;gap:9px}
.check input{accent-color:var(--sage);width:17px;height:17px}
.input,textarea,select{width:100%;border:1px solid var(--line);background:#fffefa;border-radius:11px;padding:11px 12px;color:var(--ink);outline:none}
textarea{min-height:115px;resize:vertical}
.input:focus,textarea:focus,select:focus{border-color:var(--sage)}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.form-grid .full{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.journey-card{background:var(--ink);color:#fff;padding:26px;border-radius:24px;position:relative;overflow:hidden}
.journey-card:after{content:"";position:absolute;width:220px;height:220px;border:1px solid rgba(255,255,255,.08);border-radius:50%;right:-80px;top:-80px}

.badges{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}

.daily-body{padding:28px 0}

.mood-row{display:flex;gap:9px;flex-wrap:wrap}

.nav-days{display:flex;justify-content:space-between;gap:10px;margin:16px auto;max-width:1040px}

.heat[data-v="1"]{background:#d9e4d8}.heat[data-v="2"]{background:#b8cdb8}.heat[data-v="3"]{background:#91ad92}.heat[data-v="4"]{background:#69866d}

.cal-day.today{outline:2px solid var(--gold)}

.cal-day .dot{width:6px;height:6px;background:var(--sage);border-radius:50%;display:inline-block}
.timeline{position:relative;padding-left:26px}
.timeline:before{content:"";position:absolute;left:7px;top:0;bottom:0;width:1px;background:var(--line)}
.timeline-item{position:relative;padding:0 0 18px}
.timeline-item:before{content:"";position:absolute;left:-23px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--sage);border:3px solid var(--paper)}
.timeline-item h4{margin:0 0 4px;font-family:Georgia,serif;font-size:18px}

.table{width:100%;border-collapse:collapse}
.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #eee8de;font-size:13px}
.table th{color:var(--muted);font-weight:500}
.empty{text-align:center;padding:38px;color:var(--muted)}

.toast.show{opacity:1;transform:none}
.overlay{position:fixed;inset:0;background:rgba(35,32,28,.48);display:flex;align-items:center;justify-content:center;padding:20px;z-index:80}
.modal{max-width:540px;width:100%;background:var(--paper);border-radius:22px;border:1px solid var(--line);box-shadow:var(--shadow);padding:26px}
.modal h2{margin-top:0;font-size:28px}
.welcome{min-height:100vh;display:grid;place-items:center;padding:24px}
.welcome-card{max-width:760px;width:100%;text-align:center;background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);padding:70px 40px}
.welcome-card h1{font-size:62px;margin:8px 0}
.welcome-card p{color:var(--muted);font-size:18px;line-height:1.6}
.eyebrow{letter-spacing:.25em;text-transform:uppercase;color:var(--gold);font-size:11px;font-weight:700}
.feature-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:28px 0}
.feature-row span{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}
.onboard{text-align:left;max-width:620px;margin:30px auto 0}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.option{display:flex;gap:9px;align-items:center;border:1px solid var(--line);padding:10px;border-radius:11px;background:#fffefa}
.option input{accent-color:var(--sage)}
.small{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:10px;padding:4px 7px;border-radius:999px;background:var(--sage2);color:#516354}
.kpi{font-family:Georgia,serif;font-size:28px}
@media(max-width:1000px){
  .app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;padding:7px;border-right:0;border-top:1px solid var(--line);z-index:50}.brand,.sidebar-foot{display:none}.nav{grid-template-columns:repeat(6,1fr);gap:2px}.nav button{justify-content:center;padding:9px 5px;font-size:0}.nav button .icon{font-size:18px}.main{padding:16px 14px 82px}.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:1fr 1fr}.book-page{padding:34px 28px}.book-page:before{left:17px}
}
@media(max-width:650px){
  .hero{align-items:flex-start;flex-direction:column}.hero h2{font-size:34px}.grid-4,.grid-3,.grid-2,.form-grid{grid-template-columns:1fr}.welcome-card{padding:50px 22px}.welcome-card h1{font-size:45px}.book-page{padding:28px 18px;min-height:0}.daily-head h1{font-size:39px}.heatmap{grid-template-columns:repeat(15,1fr)}.topbar{align-items:flex-start}.top-actions .btn{font-size:12px}.calendar{gap:3px}.cal-day{min-height:49px;padding:5px}.options{grid-template-columns:1fr}
}

round:#6f8c72}.habit-cell[data-level="5"]{background:#4e6e54}.habit-cell:hover{outline:2px solid var(--gold);outline-offset:1px}.board-legend{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);margin-top:9px}.legend-box{width:12px;height:12px;border-radius:3px;background:#eee9df}.legend-box.l1{background:#dce5da}.legend-box.l2{background:#b9cdb8}.legend-box.l3{background:#91ad92}.legend-box.l4{background:#6f8c72}.week-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:160px;align-items:end}.week-day{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}.week-bar-wrap{height:115px;width:100%;display:flex;align-items:flex-end;justify-content:center}.week-bar{width:70%;max-width:30px;min-height:3px;border-radius:7px 7px 3px 3px;background:var(--sage)}.week-day strong{font-size:10px}.week-day span{font-size:9px;color:var(--muted)}.consistency-list{display:grid;gap:4px}.consistency-row{display:grid;grid-template-columns:24px 1fr 42px;gap:7px;align-items:center;padding:7px 0;border-bottom:1px dotted var(--line)}.consistency-row:last-child{border-bottom:0}.rank{font:13px Georgia,serif;color:var(--gold)}.consistency-name{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.consistency-track{height:5px;background:#ece6dc;border-radius:10px;margin-top:5px;overflow:hidden}.consistency-track i{display:block;height:100%;background:var(--sage)}.consistency-pct{font-size:11px;text-align:right;font-weight:700}.mini-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini-box{padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--paper2)}.mini-box b{font:20px Georgia,serif;display:block}.mini-box span{font-size:10px;color:var(--muted)}.goal-bars{display:grid;gap:11px}.goal-line{display:grid;grid-template-columns:130px 1fr 45px;gap:8px;align-items:center}.goal-line span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.goal-line .progress{height:7px}.pulse-grid{display:grid;grid-template-columns:repeat(30,1fr);gap:3px}.pulse-cell{aspect-ratio:1;border-radius:3px;background:#eee9df}.pulse-cell[data-v="1"]{background:#dce5da}.pulse-cell[data-v="2"]{background:#b9cdb8}.pulse-cell[data-v="3"]{background:#91ad92}.pulse-cell[data-v="4"]{background:#6f8c72}.section-gap{height:16px}@media(max-width:1100px){.stat-strip{grid-template-columns:repeat(3,1fr)}.dashboard-grid{grid-template-columns:1fr}}@media(max-width:650px){.dash-hero{align-items:flex-start;flex-direction:column}.dash-title{font-size:34px}.stat-strip{grid-template-columns:repeat(2,1fr)}.mini-metrics{grid-template-columns:1fr 1fr 1fr}.goal-line{grid-template-columns:95px 1fr 40px}.pulse-grid{grid-template-columns:repeat(15,1fr)}}

<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
(() => {
"use strict";

const KEY = "lifeTracker.v1";
const TRACK_OPTIONS = ["Habits","Mood","Sleep","Study","Exercise","Water","Reading","Goals","Journal","Productivity"];
const DEFAULT_HABITS = [
  {id:uid(),name:"Exercise",icon:"🏋",color:"sage",type:"boolean",target:1,frequency:"daily",startDate:null,endDate:null,active:true},
  {id:uid(),name:"Study",icon:"📚",color:"blue",type:"duration",target:2,frequency:"daily",startDate:null,endDate:null,active:true},
  {id:uid(),name:"Reading",icon:"📖",color:"gold",type:"boolean",target:1,frequency:"daily",startDate:null,endDate:null,active:true},
  {id:uid(),name:"Water",icon:"💧",color:"blue",type:"number",target:8,frequency:"daily",startDate:null,endDate:null,active:true}
];

let state = load();
let currentDate = todayKey();
let view = "today";
let settingsOpen = false;

function uid(){ return "id_"+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function load(){
  try { const x=JSON.parse(localStorage.getItem(KEY)); return x || null; } catch(e){ return null; }
}
function save(){ localStorage.setItem(KEY,JSON.stringify(state)); }
function todayKey(){ return keyFromDate(new Date()); }
function parseKey(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function keyFromDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function addDays(s,n){const d=parseKey(s);d.setDate(d.getDate()+n);return keyFromDate(d)}
function diffDays(a,b){ return Math.round((parseKey(b)-parseKey(a))/86400000); }
function daysInMonth(y,m){return new Date(y,m,0).getDate()}
function isLeapYear(y){return y%4===0&&(y%100!==0||y%400===0)}
function clampDay(y,m,d){ return Math.min(d,daysInMonth(y,m)); }
function addYearsSameDay(s,n){const d=parseKey(s), y=d.getFullYear()+n; return keyFromDate(new Date(y,d.getMonth(),clampDay(y,d.getMonth()+1,d.getDate())));}
function addMonthsSameDay(s,n){const d=parseKey(s); let target=new Date(d.getFullYear(),d.getMonth()+n,1); return keyFromDate(new Date(target.getFullYear(),target.getMonth(),clampDay(target.getFullYear(),target.getMonth()+1,d.getDate())));}
function fmt(s,opts={year:"numeric",month:"long",day:"numeric"}){return parseKey(s).toLocaleDateString(undefined,opts)}
function shortFmt(s){return parseKey(s).toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function isoDateTime(){return new Date().toISOString()}

function journeyInfo(date=currentDate){
  if(!state) return null;
  const start=state.profile.startDate;
  const day=diffDays(start,date)+1;
  if(day<1) return {future:false,day};
  const year=Math.floor((day-1)/365)+1; // corrected below using anniversary boundaries
  let y=1;
  while(parseKey(addYearsSameDay(start,y))<=parseKey(date)) y++;
  const yearStart=addYearsSameDay(start,y-1);
  const yearEnd=addDays(addYearsSameDay(start,y),-1);
  let m=1, ms=yearStart;
  while(parseKey(addMonthsSameDay(yearStart,m))<=parseKey(date)){m++; ms=addMonthsSameDay(yearStart,m-1)}
  const me=addDays(addMonthsSameDay(yearStart,m),-1);
  return {day,year,month:m,yearStart,yearEnd,monthStart:ms,monthEnd:me};
}
function getDayRecord(date=currentDate, create=false){
  const info=journeyInfo(date);
  if(!info || info.day<1) return null;
  if(!state.days[date] && create){
    state.days[date]={
      date, journeyDay:info.day, journeyYear:info.year, journeyMonth:info.month,
      mood:"", habits:{}, sleep:{bed:"",wake:"",hours:0}, study:{hours:0,subject:"",sessions:0,tasks:0},
      exercise:0, water:0, reading:0, goals:{}, score:0, journal:"", intention:"", reflection:"",
      createdAt:isoDateTime(), updatedAt:isoDateTime()
    };
  }
  return state.days[date] || null;
}
function ensureRecord(date=currentDate){ const r=getDayRecord(date,true); r.updatedAt=isoDateTime(); save(); return r; }

function monthDays(info){let out=[], d=info.monthStart; while(parseKey(d)<=parseKey(info.monthEnd)){out.push(d);d=addDays(d,1)} return out}
function yearDays(info){let out=[],d=info.yearStart;while(parseKey(d)<=parseKey(info.yearEnd)){out.push(d);d=addDays(d,1)}return out}
function recordsBetween(a,b){let out=[]; for(let d=a;parseKey(d)<=parseKey(b);d=addDays(d,1)){if(state.days[d])out.push(state.days[d])} return out}
function trackedCount(a,b){return recordsBetween(a,b).filter(r=>hasContent(r)).length}
function hasContent(r){return !!(r.mood||r.journal||r.intention||r.reflection||r.score||Object.keys(r.habits||{}).length||r.sleep.hours||r.study.hours||r.exercise||r.water||r.reading)}
function avg(arr){const x=arr.filter(n=>Number.isFinite(n)&&n>0);return x.length?x.reduce((a,b)=>a+b,0)/x.length:0}
function sleepHours(r){
  if(!r) return 0;
  if(Number(r.sleep?.hours)) return Number(r.sleep.hours);
  if(r.sleep?.bed && r.sleep?.wake){
    let b=r.sleep.bed.split(":").map(Number), w=r.sleep.wake.split(":").map(Number);
    let mins=(w[0]*60+w[1])-(b[0]*60+b[1]); if(mins<0)mins+=1440; return mins/60;
  }
  return 0;
}
function stats(a,b){
  const rs=recordsBetween(a,b), n=rs.length;
  const habitChecks=rs.reduce((sum,r)=>sum+Object.values(r.habits||{}).filter(v=>v===true||Number(v)>0).length,0);
  const activeHabits=Math.max(1,state.habits.filter(h=>h.active).length);
  const possible=Math.max(1,n*activeHabits);
  const journal=rs.filter(r=>r.journal?.trim()).length;
  const study=rs.reduce((s,r)=>s+Number(r.study?.hours||0),0);
  const exercise=rs.filter(r=>Number(r.exercise)>0 || r.habits?.Exercise===true).length;
  const water=avg(rs.map(r=>Number(r.water)||0));
  const sleep=avg(rs.map(sleepHours));
  const score=avg(rs.map(r=>Number(r.score)||0));
  const mood={};
  rs.forEach(r=>{if(r.mood)mood[r.mood]=(mood[r.mood]||0)+1});
  return {days:n,tracked:rs.filter(hasContent).length,habitPct:Math.round(habitChecks/possible*100),journal,study,exercise,water,sleep,score,mood};
}

function dashStat(ic,label,value,foot){return `<div class="stat-card"><div class="stat-icon">${ic}</div><div class="stat-label">${label}</div><div class="stat-value">${escape(value)}</div><div class="stat-foot">${foot}</div></div>`}
function habitActiveOn(h,d){return parseKey(d)>=parseKey(h.startDate||state.profile.startDate)&&(!h.endDate||parseKey(d)<=parseKey(h.endDate))}
function habitValueComplete(h,val){if(val===true)return true;const n=Number(val);if(!Number.isFinite(n)||n<=0)return false;if(h.type==="rating")return n>=Math.max(1,Number(h.target||1));return n>=Math.max(.0001,Number(h.target||1))}
function habitLevel(h,val){if(!val)return 0;if(val===true)return 5;const n=Number(val),t=Math.max(.0001,Number(h.target||1));return Math.min(5,Math.max(1,Math.ceil(n/t*5)))}
function dayHabitPct(d){const hs=state.habits.filter(h=>h.active&&habitActiveOn(h,d)),r=getDayRecord(d);if(!hs.length)return 0;return Math.round(hs.filter(h=>habitValueComplete(h,r?.habits?.[h.id])).length/hs.length*100)}
function habitMonthTable(i,habits){const ds=monthDays(i);return `<table><thead><tr><th>Habit</th>${ds.map(d=>`<th>${parseKey(d).getDate()}</th>`).join("")}</tr></thead><tbody>${habits.map(h=>`<tr><td>${h.icon} ${escape(h.name)}</td>${ds.map(d=>{const r=state.days[d],v=r?.habits?.[h.id],level=habitActiveOn(h,d)?habitLevel(h,v):0;return `<td><button class="habit-cell" data-level="${level}" title="${escape(h.name)} · ${fmt(d)} · ${v??"not tracked"}" onclick="openDate('${d}')"></button></td>`}).join("")}</tr>`).join("")}</tbody></table>`}
function topHabits(a,b,limit=15){return state.habits.map(h=>{let eligible=0,done=0;for(let d=a;parseKey(d)<=parseKey(b);d=addDays(d,1)){if(habitActiveOn(h,d)){eligible++;if(habitValueComplete(h,state.days[d]?.habits?.[h.id]))done++}}return {h,pct:eligible?Math.round(done/eligible*100):0,eligible,done}}).filter(x=>x.eligible>0).sort((a,b)=>b.pct-a.pct||b.done-a.done).slice(0,limit)}
function lastSevenDays(end){const out=[];for(let n=6;n>=0;n--){const d=addDays(end,-n);if(parseKey(d)>=parseKey(state.profile.startDate))out.push({date:d,pct:dayHabitPct(d)})}return out}

function renderTimeline(){
 const i=journeyInfo(currentDate), items=[];
 for(let y=1;y<=Math.max(i.year,3);y++){const ys=addYearsSameDay(state.profile.startDate,y-1), ye=addDays(addYearsSameDay(state.profile.startDate,y),-1);items.push({y,ys,ye,done:parseKey(ye)<new Date()})}
 return `<div class="hero"><div><div class="kicker">The long view</div><h2>Journey Timeline</h2><p>Every year is a volume. Every month is a chapter.</p></div></div>
 <div class="grid grid-2"><div class="card"><h3>My journey</h3><div class="timeline">${items.map(x=>`<div class="timeline-item"><h4>Year ${x.y} ${x.done?"✓":"→"}</h4><p>${fmt(x.ys)} → ${fmt(x.ye)}</p><div class="actions"><button class="btn" onclick="openYear(${x.y})">Open Year</button></div></div>`).join("")}</div></div>
 <div class="card"><h3>Journey heatmap</h3><p class="small">Each square is one journey day. Intensity reflects your daily tracking activity.</p><div class="heatmap">${heatmapCells().join("")}</div><div class="small" style="margin-top:10px">Less · more activity</div></div></div>`;
}
function heatmapCells(){
 const i=journeyInfo(currentDate), out=[]; const start=i.yearStart;
 for(let n=0;n<365;n++){const d=addDays(start,n);if(parseKey(d)>parseKey(i.yearEnd))break;const r=state.days[d];let v=0;if(r){if(hasContent(r))v=1;if(r.journal)v++;if(r.score>=70)v++;if(Object.keys(r.habits||{}).length)v++;}out.push(`<button class="heat" data-v="${Math.min(4,v)}" title="${fmt(d)}"></button>`)} return out;
}
window.openYear=function(y){const d=addYearsSameDay(state.profile.startDate,y-1);currentDate=d;view="year";render()}

function renderCalendar(){
 const d=parseKey(currentDate), y=d.getFullYear(), m=d.getMonth(), first=new Date(y,m,1), start=state.profile.preferences.weekStart==="sunday"?first.getDay():(first.getDay()+6)%7;

}

 </div>`;
}
window.saveProfile=function(){state.profile.name=document.getElementById("profileName").value;save();toast("Profile saved.")};
window.savePrefs=function(){state.profile.preferences.theme=document.getElementById("theme").value;state.profile.preferences.weekStart=document.getElementById("weekStart").value;state.profile.preferences.timeFormat=document.getElementById("timeFormat").value;save();applyTheme();toast("Preferences saved.");render()};
function applyTheme(){const t=state?.profile?.preferences?.theme;if(t==="dark" || (t==="system"&&matchMedia("(prefers-color-scheme:dark)").matches)){document.documentElement.style.setProperty("--bg","#20201d");document.documentElement.style.setProperty("--paper","#2a2925");document.documentElement.style.setProperty("--paper2","#33312c");document.documentElement.style.setProperty("--ink","#f5f1e8");document.documentElement.style.setProperty("--muted","#aaa69c");document.documentElement.style.setProperty("--line","#4b4942")}else{document.documentElement.style.setProperty("--bg","#f4f0e7");document.documentElement.style.setProperty("--paper","#fffdf8");document.documentElement.style.setProperty("--paper2","#f8f4eb");document.documentElement.style.setProperty("--ink","#292824");document.documentElement.style.setProperty("--muted","#7b776f");document.documentElement.style.setProperty("--line","#ded7ca")}}
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});downloadBlob(blob,"life-tracker-backup.json");toast("JSON backup exported.")};
function exportCSV(){let rows=[["date","journeyDay","journeyYear","journeyMonth","mood","sleepHours","studyHours","exerciseMinutes","water","readingMinutes","score","journal"]];Object.keys(state.days).sort().forEach(d=>{const r=state.days[d];rows.push([d,r.journeyDay,r.journeyYear,r.journeyMonth,r.mood,sleepHours(r),r.study?.hours||0,r.exercise||0,r.water||0,r.reading||0,r.score||0,(r.journal||"").replace(/\n/g," ")])});const csv=rows.map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");downloadBlob(new Blob([csv],{type:"text/csv"}),"life-tracker-days.csv");toast("CSV exported.")};
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
window.importJSON=function(file){if(!file)return;const fr=new FileReader();fr.onload=()=>{try{const incoming=JSON.parse(fr.result);if(!incoming.profile?.startDate||!incoming.days)throw new Error();confirmBox("Import this backup as a separate replacement of the current local data? Export your current data first if needed.",()=>{state=incoming;save();currentDate=todayKey();render();toast("Backup imported.")})}catch(e){toast("Invalid Life Tracker backup.")}};fr.readAsText(file)};
window.resetJourney=function(){confirmBox("Delete the entire Life Tracker from this browser? This cannot be undone. Export first if you want a backup.",()=>{localStorage.removeItem(KEY);state=null;renderWelcome()})}

function streak(){let n=0,d=todayKey();while(parseKey(d)>=parseKey(state.profile.startDate)){const r=state.days[d];if(!r||!hasContent(r))break;n++;d=addDays(d,-1)}return n}
function calcScore(r){let s=0;const hs=state.habits.filter(h=>h.active);if(hs.length)s+=hs.filter(h=>r.habits[h.id]).length/hs.length*60;if(r.journal)s+=15;if(r.mood)s+=5;if(sleepHours(r)>=7)s+=10;if(r.study.hours>0)s+=10;return Math.round(Math.min(100,s))}
function modal(body){document.body.insertAdjacentHTML("beforeend",`<div class="overlay" id="modal"><div class="modal">${body}</div></div>`)}
function closeModal(){document.getElementById("modal")?.remove()}
window.closeModal=closeModal;
function confirmBox(message,yes){modal(`<h2>Are you sure?</h2><p class="small">${escape(message)}</p><div class="actions"><button class="btn danger" id="confirmYes">Continue</button><button class="btn" onclick="closeModal()">Cancel</button></div>`);document.getElementById("confirmYes").onclick=()=>{closeModal();yes()} }
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),2200)}

applyTheme();init();
setInterval(()=>{if(state && todayKey()!==currentDate && view==="today"){currentDate=todayKey();render()}},30000);
})();
</script>
</body>
</html>
